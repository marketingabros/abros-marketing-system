    paid_expertise_could_materially_improve: true

  - id: benchmarking_method
    previous_capability: Benchmarking
    primary_layer: SOCIAL_CORE
    supporting_layers: [PLATFORM, BUSINESS_MODEL, VERTICAL, RUNTIME_DATA]
    why: Comparator selection and definition-preserving interpretation are durable; benchmark values and metric definitions are volatile inputs.
    durability: DURABLE
    shared_across_brands: true
    requires_external_expertise: true
    paid_expertise_could_materially_improve: false

  - id: current_algorithm_platform_knowledge
    previous_capability: Current algorithm/platform knowledge
    primary_layer: PLATFORM
    supporting_layers: []
    why: Ranking, recommendation, eligibility, feature and metric claims are platform-owned, time-sensitive facts.
    durability: VOLATILE
    shared_across_brands: true
    requires_external_expertise: true
    paid_expertise_could_materially_improve: false

  - id: platform_change_monitoring
    previous_capability: Platform-change monitoring
    primary_layer: PLATFORM
    supporting_layers: [RUNTIME_DATA]
    why: Monitoring maintains the platform knowledge lifecycle; dated alerts are runtime evidence until verified against primary sources.
    durability: VOLATILE
    shared_across_brands: true
    requires_external_expertise: true
    paid_expertise_could_materially_improve: false

  - id: restaurant_local_demand
    previous_capability: Restaurant/local demand
    primary_layer: VERTICAL
    supporting_layers: [BUSINESS_MODEL, BRAND_OS, RUNTIME_DATA]
    why: The former capability is decomposed; local attendance, catchment and capacity move to Local Venue/Experience, while restaurant service-period, menu and reservation decisions remain in Restaurant.
    durability: DURABLE
    shared_across_brands: false
    requires_external_expertise: true
    paid_expertise_could_materially_improve: true

  - id: social_to_reservation_measurement
    previous_capability: Social-to-reservation measurement
    primary_layer: BUSINESS_MODEL
    supporting_layers: [VERTICAL, PLATFORM, RUNTIME_DATA]
    why: Booking and online-to-offline conversion measurement is principally a Local Venue/Experience mechanic; restaurant-specific covers and service periods extend it.
    durability: DURABLE
    shared_across_brands: true
    requires_external_expertise: false
    paid_expertise_could_materially_improve: true

  - id: human_approval_and_qa
    previous_capability: Human approval and QA
    primary_layer: SOCIAL_CORE
    supporting_layers: [PLATFORM, BUSINESS_MODEL, VERTICAL, BRAND_OS, RUNTIME_DATA]
    why: Approval authority and evidence policy apply across brands; execution belongs in deterministic workflows and independent evals outside generation.
    durability: DURABLE
    shared_across_brands: true
    requires_external_expertise: false
    paid_expertise_could_materially_improve: false

  - id: business_model_commercial_mechanics
    previous_capability: New explicit architecture capability
    primary_layer: BUSINESS_MODEL
    supporting_layers: [RUNTIME_DATA]
    why: Conversion event, journey, geography, capacity, timing, repeat frequency and friction vary by how the business operates.
    durability: DURABLE
    shared_across_brands: true
    requires_external_expertise: false
    paid_expertise_could_materially_improve: true

  - id: industry_specific_decision_logic
    previous_capability: Restaurant vertical module and future justified verticals
    primary_layer: VERTICAL
    supporting_layers: [BUSINESS_MODEL, RUNTIME_DATA]
    why: Industry-only proof, risk and decision logic should load only where it adds material value beyond business mechanics.
    durability: DURABLE
    shared_across_brands: false
    requires_external_expertise: true
    paid_expertise_could_materially_improve: true

  - id: brand_identity_positioning_and_voice
    previous_capability: Brand context previously described as runtime input
    primary_layer: BRAND_OS
    supporting_layers: []
    why: Identity, positioning, audience definitions, tone and visual rules are authoritative brand truth and must never enter shared Skills.
    durability: DURABLE
    shared_across_brands: false
    requires_external_expertise: false
    paid_expertise_could_materially_improve: false

  - id: brand_product_service_and_approved_rules
    previous_capability: Brand and offer context previously described as runtime input
    primary_layer: BRAND_OS
    supporting_layers: []
    why: Stable product/service truth, approved work, management decisions and approved learnings belong to one Brand OS.
    durability: DURABLE
    shared_across_brands: false
    requires_external_expertise: false
    paid_expertise_could_materially_improve: false

  - id: current_objectives_priorities_and_operations
    previous_capability: Planning and strategy inputs
    primary_layer: RUNTIME_DATA
    supporting_layers: [BRAND_OS]
    why: Current priorities, capacity, stock, availability, hours and campaign state are time-bounded facts; stable approved objectives may also be referenced from Brand OS.
    durability: VOLATILE
    shared_across_brands: false
    requires_external_expertise: false
    paid_expertise_could_materially_improve: false

  - id: brand_performance_and_social_history
    previous_capability: Performance diagnosis inputs
    primary_layer: RUNTIME_DATA
    supporting_layers: []
    why: Results and history are brand-specific evidence that must remain separate from permanent brand rules and shared methodology.
    durability: VOLATILE
    shared_across_brands: false
    requires_external_expertise: false
    paid_expertise_could_materially_improve: false

  - id: observations_hypotheses_and_external_context
    previous_capability: Learning and market-intelligence inputs
    primary_layer: RUNTIME_DATA
    supporting_layers: []
    why: Unapproved observations, competitor findings, events and hypotheses require provenance, time bounds and review before any promotion.
    durability: VOLATILE
    shared_across_brands: false
    requires_external_expertise: false
    paid_expertise_could_materially_improve: false

  - id: benchmark_values_and_platform_metric_extracts
    previous_capability: Benchmarking and diagnosis inputs
    primary_layer: RUNTIME_DATA
    supporting_layers: [PLATFORM]
    why: Values, samples, denominators, extraction dates and metric snapshots expire even though the comparison method is durable.
    durability: VOLATILE
    shared_across_brands: true
    requires_external_expertise: true
    paid_expertise_could_materially_improve: false

loading_contract:
  always_load: [SOCIAL_CORE]
  load_if_requested: [PLATFORM]
  load_exactly_one_primary: [BUSINESS_MODEL]
  load_only_if_approved_and_relevant: [VERTICAL]
  load_exactly_one_brand: [BRAND_OS]
  load_minimum_relevant_window: [RUNTIME_DATA]
  never_carry_between_brands: [BRAND_OS, RUNTIME_DATA]
