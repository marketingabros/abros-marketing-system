    paid_expertise_could_materially_improve: true

  - id: creative_briefing
    previous_capability: Briefing designers/photographers/video
    primary_layer: SOCIAL_CORE
    supporting_layers: [PLATFORM, VERTICAL, BRAND_OS, RUNTIME_DATA]
    why: A decision-complete brief contract transfers across brands; deliverable specs, domain risks, identity and available assets are inputs.
    durability: DURABLE
    shared_across_brands: true
    requires_external_expertise: false
