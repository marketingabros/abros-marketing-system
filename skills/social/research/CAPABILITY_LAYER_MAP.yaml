schema_version: "1.0"
title: Abros Social Capability Layer Map
decision_date: "2026-09-07"
status: architecture_only
source_scope:
  - SOCIAL_EXPERTISE_LANDSCAPE.md
  - SOCIAL_SKILL_CANDIDATES.yaml
  - INSTAGRAM_CURRENT_KNOWLEDGE.md
  - RESTAURANT_SOCIAL_FINDINGS.md
  - BUILD_VS_BUY_RECOMMENDATION.md
  - PAID_EXPERTISE_GAPS.md
  - PAID_RESOURCE_EVALUATION_RUBRIC.yaml

classification_values:
  - SOCIAL_CORE
  - PLATFORM
  - BUSINESS_MODEL
  - VERTICAL
  - BRAND_OS
  - RUNTIME_DATA

rules:
  primary_layer: Every capability has one authoritative home.
  decomposition: Supporting layers may supply scoped inputs but must not duplicate the primary method.
  durable: Stable methodology or approved knowledge; changes only through review.
  volatile: Current facts, platform state, operational state, observations, or performance requiring refresh.
  paid_value: True means paid practitioner methodology could materially improve decision quality; it does not mean purchase is required.

capabilities:
  - id: objective_selection_and_channel_role
    previous_capability: Objective selection and channel role
    primary_layer: SOCIAL_CORE
    supporting_layers: [BUSINESS_MODEL, BRAND_OS, RUNTIME_DATA]
    why: The translation method is cross-industry; the business outcome, brand priorities and current constraints arrive from scoped context.
    durability: DURABLE
    shared_across_brands: true
    requires_external_expertise: false
    paid_expertise_could_materially_improve: false

  - id: audience_behaviour_and_content_pillars
    previous_capability: Audience behaviour and content pillars
    primary_layer: SOCIAL_CORE
    supporting_layers: [BUSINESS_MODEL, VERTICAL, BRAND_OS, RUNTIME_DATA]
    why: Audience-job and portfolio design are reusable methods, while actual audiences and observed behaviour are brand/runtime truth.
    durability: DURABLE
    shared_across_brands: true
    requires_external_expertise: false
    paid_expertise_could_materially_improve: false

  - id: frequency_and_content_mix
    previous_capability: Frequency and content mix
    primary_layer: SOCIAL_CORE
    supporting_layers: [PLATFORM, BUSINESS_MODEL, BRAND_OS, RUNTIME_DATA]
    why: Portfolio and capacity trade-offs are general judgment; current platform constraints and brand performance are inputs, never universal cadence rules.
    durability: DURABLE
    shared_across_brands: true
    requires_external_expertise: false
    paid_expertise_could_materially_improve: true

  - id: launch_strategy
    previous_capability: Launch strategy
    primary_layer: SOCIAL_CORE
    supporting_layers: [BUSINESS_MODEL, VERTICAL, BRAND_OS, RUNTIME_DATA]
    why: Staging uncertainty, proof and action is general campaign strategy; conversion readiness and industry risk are selectively supplied.
    durability: DURABLE
    shared_across_brands: true
    requires_external_expertise: false
    paid_expertise_could_materially_improve: true

  - id: awareness_engagement_conversion
    previous_capability: Awareness vs engagement vs conversion
    primary_layer: SOCIAL_CORE
    supporting_layers: [BUSINESS_MODEL, PLATFORM, RUNTIME_DATA]
    why: The objective-to-outcome hierarchy is universal; conversion events and platform measures are layer-specific.
    durability: DURABLE
    shared_across_brands: true
    requires_external_expertise: false
    paid_expertise_could_materially_improve: false

  - id: performance_diagnosis
    previous_capability: Performance diagnosis
    primary_layer: SOCIAL_CORE
    supporting_layers: [PLATFORM, BUSINESS_MODEL, VERTICAL, RUNTIME_DATA]
    why: Alternative-hypothesis diagnosis and next-test selection are cross-industry; definitions, commercial mechanics and actual results remain scoped inputs.
    durability: DURABLE
    shared_across_brands: true
    requires_external_expertise: false
    paid_expertise_could_materially_improve: true

  - id: weekly_monthly_planning
    previous_capability: Weekly/monthly planning
    primary_layer: SOCIAL_CORE
    supporting_layers: [BUSINESS_MODEL, BRAND_OS, RUNTIME_DATA]
    why: Prioritisation, portfolio balance and feasibility review are general methods driven by brand and operational inputs.
    durability: DURABLE
    shared_across_brands: true
    requires_external_expertise: false
    paid_expertise_could_materially_improve: false

  - id: campaign_sequencing
    previous_capability: Campaign sequencing
    primary_layer: SOCIAL_CORE
    supporting_layers: [BUSINESS_MODEL, VERTICAL, BRAND_OS, RUNTIME_DATA]
    why: Stage gates, dependencies and narrative progression transfer across industries; commercial timing is selectively loaded.
    durability: DURABLE
    shared_across_brands: true
    requires_external_expertise: false
    paid_expertise_could_materially_improve: true

  - id: repetition_prevention
    previous_capability: Repetition prevention
    primary_layer: SOCIAL_CORE
    supporting_layers: [BRAND_OS, RUNTIME_DATA]
    why: Content fingerprinting, controlled reuse and fatigue reasoning are cross-industry; actual tolerance is learned per brand.
    durability: DURABLE
    shared_across_brands: true
    requires_external_expertise: false
    paid_expertise_could_materially_improve: true

  - id: reels_craft
