    why: Persuasive function, truth and critique are general; platform presentation, conversion action and voice are loaded separately.
    durability: DURABLE
    shared_across_brands: true
    requires_external_expertise: false
    paid_expertise_could_materially_improve: true

  - id: community_comments_replies_dms
    previous_capability: Community/comments/replies/DMs
    primary_layer: SOCIAL_CORE
    supporting_layers: [PLATFORM, BUSINESS_MODEL, VERTICAL, BRAND_OS, RUNTIME_DATA]
    why: Relationship objectives and triage principles are shared; platform controls, conversion context, specialist risk and live messages are scoped.
    durability: DURABLE
    shared_across_brands: true
    requires_external_expertise: false
    paid_expertise_could_materially_improve: true

  - id: ugc_and_social_proof
    previous_capability: UGC and social proof
    primary_layer: SOCIAL_CORE
    supporting_layers: [PLATFORM, BUSINESS_MODEL, VERTICAL, BRAND_OS, RUNTIME_DATA]
    why: Authenticity, proof selection and consent principles are general; effective proof and disclosure requirements vary by layer.
    durability: DURABLE
    shared_across_brands: true
    requires_external_expertise: true
    paid_expertise_could_materially_improve: true

  - id: competitor_analysis
    previous_capability: Competitor analysis
    primary_layer: SOCIAL_CORE
    supporting_layers: [BUSINESS_MODEL, VERTICAL, BRAND_OS, RUNTIME_DATA]
    why: Convention, whitespace, evidence and similarity guards are reusable; the actual market set and observations are runtime data.
    durability: DURABLE
    shared_across_brands: true
