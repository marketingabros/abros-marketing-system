    primary_layer: PLATFORM
    supporting_layers: [SOCIAL_CORE, BRAND_OS, RUNTIME_DATA]
    why: Story surfaces, stickers, expiry and metrics are platform mechanics; the communication job and brand expression remain elsewhere.
    durability: VOLATILE
    shared_across_brands: true
    requires_external_expertise: true
    paid_expertise_could_materially_improve: false

  - id: creative_territories_and_concept_development
    previous_capability: Creative territories and concept development
