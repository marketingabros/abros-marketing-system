    primary_layer: PLATFORM
    supporting_layers: [SOCIAL_CORE, BUSINESS_MODEL, RUNTIME_DATA]
    why: Metric availability, retention representation and surface context are platform-specific; causal method remains in core.
    durability: VOLATILE
    shared_across_brands: true
    requires_external_expertise: true
    paid_expertise_could_materially_improve: true

  - id: carousel_craft
    previous_capability: Carousel craft
    primary_layer: PLATFORM
    supporting_layers: [SOCIAL_CORE, BRAND_OS]
    why: Carousel behaviour and specifications belong to the platform; narrative, creative strategy and visual identity do not.
    durability: VOLATILE
