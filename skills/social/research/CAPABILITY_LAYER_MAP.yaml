    supporting_layers: [BUSINESS_MODEL, VERTICAL, BRAND_OS, RUNTIME_DATA]
    why: Territory generation, selection and rejection are senior cross-industry social expertise applied to scoped truth.
    durability: DURABLE
    shared_across_brands: true
