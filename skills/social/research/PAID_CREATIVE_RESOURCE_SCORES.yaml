reconsideration_rules:
  - "Do not buy from the current public evidence."
  - "Rescore only when a provider supplies a representative methodology/case sample or new written terms."
  - "Licensing must explicitly cover named team access, retained human notes, Abros-authored derivatives and bounded AI-assisted internal use."
  - "Do not upload or reproduce provider materials in an AI system without explicit written permission."
  - "Any pilot must compare blinded pre-resource and post-resource decisions on unseen multi-model briefs."
