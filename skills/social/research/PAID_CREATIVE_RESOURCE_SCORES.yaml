    rank_by_score: 1
    resource: Assessing Creative Ideas
    provider: BetterBriefs
    resource_type: professional_course
    price: {amount: 595, currency: USD, status: public}
    delivery: "Three weeks; seven modules; about five hours plus live Q&A"
    current_availability: "Next public course listed for 2026-10-12"
    evidence_urls:
      - https://www.betterbriefs.com/assessing-creative-ideas-course
      - https://www.betterbriefs.com/academy
      - https://www.betterbriefs.com/about
      - https://www.betterbriefs.com/terms_conditions
    dimensions:
      expert_credibility: {score: 15, basis: "Named founders have long agency-strategy careers, effectiveness awards and documented teaching responsibility."}
      methodology_depth: {score: 14, basis: "Public syllabus promises a systematic idea-assessment method, bias checks, idea-versus-execution separation and preservation through development."}
      decision_quality: {score: 12, basis: "Selection, feedback and decision bias are central rather than output production."}
      case_quality: {score: 10, basis: "Cross-category exercises and cases are evidenced, but public material does not expose enough failed or longitudinal cases."}
      recency: {score: 8, basis: "Current 2026 cohort, course pages and terms; recent course debriefs show active delivery."}
      portfolio_business_model_relevance: {score: 8, basis: "Cross-category marketing method appears broadly portable, although local-service and organic-social cases are not shown publicly."}
      creative_value: {score: 8, basis: "Direct fit for evaluation, rejection, feedback and preserving ideas."}
      analytics_value: {score: 3, basis: "Commercial impact is asserted but performance interpretation and experimentation are not the course focus."}
      transferability_to_abros: {score: 7, basis: "Human evaluation process is portable in principle; social-native translation would still be Abros-authored."}
      licensing_usage_rights: {score: 0, basis: "July 2026 terms expressly prohibit AI upload/use, derivative works and using the methodology to build or improve software/tools without written permission."}
    weighted_subtotal: 85
    penalties: []
    penalty_total: 0
    final_score: 85
    gates:
      global: FAIL
      category: PASS
      failed: [licensing_usage_rights]
      hard_disqualifier: "Public licence prohibits the intended system-encoding use; written exception would be required."
    qualitative:
      social_native_depth: 2
      creative_method_depth: 5
      case_quality: 4
      business_model_transfer: {local_venue_experience: 4, local_service: 4, ecommerce_product: 4, future_unknown_industries: 4}
