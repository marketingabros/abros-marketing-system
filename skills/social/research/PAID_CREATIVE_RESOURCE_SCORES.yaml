schema_version: "1.0"
title: Paid Creative Resource Scores
phase: "3.6"
research_date: "2026-09-07"
category: cross_industry_creative_strategy_and_critique
rubric: PAID_RESOURCE_EVALUATION_RUBRIC.yaml
scope_note: >-
  Scores use only evidence available on public provider pages, course pages,
  catalogues and terms. No paid resource was accessed. Totals do not override
  global or category gates.

decision:
  final: BUY NONE
  resources_investigated: 21
  serious_candidates_scored: 15
  screened_out_before_scoring: 6
  conditional_due_diligence_leads: 3
  resources_recommended_for_purchase: 0
  rationale: >-
    No candidate demonstrates deep social-native creative methodology and written
    permission for the intended internal AI-assisted synthesis or encoding. The
    strongest content candidates expressly prohibit or do not clearly permit that use.

scale_notes:
  social_native_depth: "1 = incidental; 5 = central and operational"
  creative_method_depth: "1 = tips/inspiration; 5 = repeatable senior method"
  case_quality: "1 = claims/examples only; 5 = contextual decisions, failures and outcomes"
  business_model_transfer: "1 = poor; 5 = strong, subject to stated limits"
  price_status: "Provider currency is retained; null means no public price was found."

candidates:
