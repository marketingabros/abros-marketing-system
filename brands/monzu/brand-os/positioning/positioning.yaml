statements:
  - id: MONZU-A033
    classification: AUTHORITATIVE
    statement: "The Restaurant is a dinner experience that must not be positioned as fine dining, difficult or reserved only for special occasions."
    source_ids: [MGMT-001]
    approval_status: explicit_management_decision
    current_status: current
  - id: MONZU-A034
    classification: AUTHORITATIVE
    statement: "Piazza is the relaxed-gathering expression and must remain distinct from the Restaurant in food and service rhythm."
    source_ids: [MGMT-001]
    approval_status: explicit_management_decision
    current_status: current
  - id: MONZU-A035
    classification: AUTHORITATIVE
    statement: "Cellar is defined by curation, guidance, gifting and relevance rather than exhaustive range, volume or price comparison."
    source_ids: [MGMT-001]
    approval_status: explicit_management_decision
    current_status: current
  - id: MONZU-A036
    classification: AUTHORITATIVE
    statement: "The three experiences must be understandable through practical use; their distinction must not depend on a long brand explanation."
    source_ids: [MGMT-001]
    approval_status: explicit_management_decision
    current_status: current
  - id: MONZU-A037
    classification: AUTHORITATIVE
    statement: "Cultivated reference brands are inspiration only; they are not verified competitors and must not be copied."
    source_ids: [MGMT-001]
    approval_status: explicit_management_context
    current_status: current
