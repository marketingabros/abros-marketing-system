section: business_strategy
lifecycle: durable
statements:
  - id: MONZU-A040
    classification: AUTHORITATIVE
    statement: "Commercial adaptation may change allocation or emphasis but must not erase the conceptual boundaries among Restaurant, Piazza and Cellar."
    source_ids: [MGMT-001]
    approval_status: explicit_management_decision
    current_status: current
  - id: MONZU-A041
    classification: AUTHORITATIVE
    statement: "No commercial decision may blur Restaurant, Piazza and Cellar."
    source_ids: [MGMT-001]
    approval_status: explicit_management_prohibition
    current_status: current
  - id: MONZU-A042
    classification: AUTHORITATIVE
    statement: "Any attempt to make the Restaurant more accessible or frequent must not lower food or hospitality standards."
    source_ids: [MGMT-001]
    approval_status: explicit_management_tradeoff_rule
    current_status: current
  - id: MONZU-A044
    classification: AUTHORITATIVE
    statement: "Piazza must offer a lower-commitment, more frequent use occasion without diluting Monzù."
    source_ids: [MGMT-001]
    approval_status: explicit_management_strategy
    current_status: current
  - id: MONZU-A045
    classification: AUTHORITATIVE
    statement: "Monzù must not use discounts, price-led promotions or influencer collaborations."
    source_ids: [MGMT-001]
    approval_status: explicit_management_prohibition
    current_status: current
  - id: MONZU-A046
    classification: AUTHORITATIVE
    statement: "Permitted attention-building may include launch invitations, PR/editorial activity, hosted events, high-end wine or spirits partnerships, and carefully selected artist or socially relevant partnerships, each subject to required approval."
    source_ids: [MGMT-001]
    approval_status: explicit_management_permission_with_case_by_case_approval
    current_status: current
